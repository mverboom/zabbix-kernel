UserParameter=kernel.active,uname -r
UserParameter=kernel.avail,ls /boot/ | sed -n "/^vmlinuz-/ s/^vmlinuz-//p" | sort --version-sort --field-separator=. | tail -n 1
UserParameter=kernel.cves,/usr/local/bin/kernel-cve-count
UserParameter=kernel.cves.list,/usr/local/bin/kernel-cve-count list
UserParameter=kernel.boot,test -e /boot/refind_linux.conf && ls -t /boot/vmlinuz-* 2>/dev/null | head -n1 | sed "s|.*/vmlinuz-||" || true
UserParameter=kernel.boot.state,if [ -e /boot/refind_linux.conf ]; then v=$(ls /boot/ | sed -n "/^vmlinuz-/ s/^vmlinuz-//p" | sort --version-sort --field-separator=. | tail -n1); m=$(ls -t /boot/vmlinuz-* 2>/dev/null | head -n1 | sed "s|.*/vmlinuz-||"); if [ "$v" = "$m" ]; then echo ok; else echo "$m"; fi; fi
